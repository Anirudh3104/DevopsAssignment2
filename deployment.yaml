apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-booking-app
  labels:
    app: ticket-booking-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-booking-app
  template:
    metadata:
      labels:
        app: ticket-booking-app
    spec:
      containers:
      - name: ticket-booking-container
        image: anirudxb31/ticket-booking-app:latest
        ports:
        - containerPort: 8501
